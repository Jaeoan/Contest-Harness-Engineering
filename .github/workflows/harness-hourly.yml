name: harness-hourly
on:
  schedule:
    - cron: "7 * * * *"   # 매시 7분 (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: { group: harness-hourly, cancel-in-progress: false }

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Skip if an auto-update PR is still open
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          n=$(gh pr list --label harness-auto --state open --json number -q 'length' || echo 0)
          echo "open_prs=$n" >> "$GITHUB_ENV"

      - name: Detect changes & update harness
        if: env.open_prs == '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm i -g @anthropic-ai/claude-code
          git config user.name "harness-bot"
          git config user.email "harness-bot@users.noreply.github.com"
          bash scripts/harness-update.sh

      - name: Persist baseline/state on main when nothing changed
        if: env.open_prs == '0'
        run: |
          git checkout -q main 2>/dev/null || true
          if [ -n "$(git status --porcelain harness/state.json)" ]; then
            git add harness/state.json && git commit -m "chore(harness): state" && git push
          fi
